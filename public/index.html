<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 읽기 숙제 / 韩语朗读作业</title>
<style>
  :root {
    --bg: #0e1330; --card: #171e45; --field: #0e1330; --ink: #e9ecff; --sub: #9ba4cc; --line: #2b3568;
    --brand: #8795ff; --brand-d: #a3aeff; --soft: #252f6b; --bad: #ff7168; --good: #3fdc9a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
    font-family: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
  [hidden] { display: none !important; }
  h1, h2, h3 { line-height: 1.25; margin: 0; }
  .sub { color: var(--sub); }
  :focus-visible { outline: 3px solid #8b97ff; outline-offset: 2px; }

  /* 버튼·입력 */
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: .65rem 1.1rem; background: var(--brand); color: #0e1330; font-weight: 700; }
  button:hover:not(:disabled) { background: var(--brand-d); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
  button.ghost:hover:not(:disabled) { background: var(--soft); }
  button.rec { background: var(--bad); }
  button.rec:hover:not(:disabled) { background: #ff8b83; }
  input, textarea { font: inherit; width: 100%; padding: .65rem .8rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); margin: .25rem 0 .8rem; }
  input:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--soft); }
  label { font-size: .9rem; font-weight: 600; }
  .status { min-height: 1.5rem; margin: .4rem 0 0; font-size: .95rem; color: var(--sub); }
  .status.err { color: var(--bad); }

  /* 홈 */
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 2.5rem; align-items: center; padding: 2rem 0 2.5rem; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.1rem); letter-spacing: -.02em; }
  .hero p { margin: 1rem 0 0; font-size: 1.05rem; max-width: 30em; }
  .demo { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 1.4rem 1.5rem; box-shadow: 0 18px 50px -24px rgba(135,149,255,.5); }
  .demo small { color: var(--sub); }
  .demo .line { font-size: 1.6rem; font-weight: 600; margin: .5rem 0 1rem; letter-spacing: .02em; }
  .demo .row { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: .8rem; }
  .demo .pct { font-size: 2.6rem; font-weight: 800; color: var(--good); }
  .bad { color: var(--bad); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }

  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .door { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.6rem; }
  .door.t { background: #26307a; color: #fff; border-color: #3a46a3; }
  .door.t .sub { color: #b7c0f0; }
  .door.t input { background: #1a2260; border-color: #3a46a3; color: #fff; }
  .door.t button { background: #fff; color: #1c2340; }
  .door.t button:hover:not(:disabled) { background: #dfe3ff; }
  .door h2 { font-size: 1.35rem; }
  .door .sub { margin: .3rem 0 1.1rem; font-size: .95rem; }
  .door .go { display: flex; gap: .6rem; }
  .door .go input { margin: 0; }
  .door .go button { white-space: nowrap; }
  

  /* 내부 화면 공통 */
  .top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.4rem; }
  .top h1 { font-size: 1.4rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.5rem; margin-bottom: 1.2rem; }
  .btns { display: flex; flex-wrap: wrap; gap: .6rem; }
  #sentence { font-size: 1.6rem; font-weight: 600; margin: .4rem 0 1.2rem; }
  audio { width: 100%; margin-top: 1rem; }
  #score { font-size: 3.4rem; font-weight: 800; color: var(--brand); line-height: 1.1; }
  #marks { font-size: 1.6rem; margin: .5rem 0; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; margin: .6rem 0; }
  .code { display: inline-block; background: var(--soft); color: var(--brand); border-radius: 6px; padding: 0 .5rem; font-weight: 700; letter-spacing: .08em; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { border-bottom: 1px solid var(--line); padding: .55rem .5rem; text-align: left; vertical-align: top; }
  th { font-size: .85rem; color: var(--sub); }
  td button { padding: .2rem .7rem; }

  @media (max-width: 760px) {
    .hero, .doors { grid-template-columns: 1fr; }
    .hero { gap: 1.5rem; padding-top: .5rem; }
  }
</style>
</head>
<body>
<div class="wrap">

<!-- 홈 -->
<section id="home">
  <div class="hero">
    <div>
      <h1>소리 내어 읽고,<br>바로 점수 확인</h1>
      <p class="sub">숙제 문장을 읽고 녹음하면 정확도가 바로 나옵니다. 선생님은 학생들의 점수와 녹음을 한곳에서 확인합니다.<br>朗读作业句子并录音，立即获得准确率。</p>
    </div>
    <div class="demo" aria-hidden="true">
      <small>예시 / 示例</small>
      <div class="line">오늘은 날씨가 <span class="bad">정</span>말 좋아요</div>
      <div class="row"><span class="sub">정확도 / 准确率</span><span class="pct">91%</span></div>
    </div>
  </div>

  <div class="doors">
    <div class="door">
      <h2>학생 <span class="sub">学生</span></h2>
      <p class="sub">선생님이 알려준 숙제 코드를 입력하세요.<br>请输入老师给的作业代码。</p>
      <div class="go">
        <input id="h-code" maxlength="6" autocapitalize="characters" placeholder="코드 / 代码" aria-label="숙제 코드">
        <button id="h-start">시작 / 开始</button>
      </div>
      <p id="h-s-status" class="status" role="status"></p>
    </div>
    <div class="door t">
      <h2>선생님 <span class="sub">老师</span></h2>
      <p class="sub">숙제를 만들고 학생 결과를 확인합니다.</p>
      <div class="go">
        <input id="h-pw" type="password" placeholder="비밀번호" aria-label="선생님 비밀번호">
        <button id="h-login">로그인</button>
      </div>
      <p id="h-t-status" class="status err" role="status"></p>
    </div>
  </div>
</section>

<!-- 학생 -->
<section id="student" hidden>
  <div class="top"><button class="ghost back">← 처음으로 / 返回</button></div>
  <div class="panel">
    <h2 id="s-title"></h2>
    <p id="sentence"></p>
    <label for="s-name">이름 / 姓名</label>
    <input id="s-name" maxlength="50">
    <div class="btns">
      <button id="rec" class="rec">● 녹음 시작 / 开始录音</button>
      <button id="stop" class="ghost" disabled>■ 정지 / 停止</button>
      <button id="send" disabled>제출 / 提交</button>
    </div>
    <audio id="player" controls hidden></audio>
    <p id="s-status" class="status" role="status"></p>
  </div>
  <div id="result" class="panel" hidden>
    <div id="score"></div>
    <div id="marks"></div>
    <p class="sub">인식 결과 / 识别结果: <span id="transcript"></span></p>
  </div>
</section>

<!-- 선생님 -->
<section id="teacher" hidden>
  <div class="top"><button class="ghost back">← 처음으로</button><h1>선생님 페이지</h1></div>
  <div class="panel">
    <h2>새 숙제 만들기</h2>
    <input id="t-title" placeholder="제목 (예: 1과 읽기)" style="margin-top:.8rem">
    <textarea id="t-sentence" rows="3" placeholder="학생이 읽을 문장"></textarea>
    <button id="create">숙제 만들기</button>
    <p id="t-status" class="status" role="status"></p>
  </div>
  <div class="panel"><h2>숙제 목록</h2><div id="list"></div></div>
  <div class="panel" id="rpanel" hidden>
    <h2 id="rh"></h2>
    <div class="tbl"><table id="results"></table></div>
  </div>
</section>

</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const say = (id, t, err) => { $(id).textContent = t || ""; $(id).classList.toggle("err", !!err); };
function show(v) {
  for (const id of ["home", "student", "teacher"]) $(id).hidden = id !== v;
  window.scrollTo(0, 0);
}
document.querySelectorAll(".back").forEach(b => b.onclick = () => show("home"));

/* ---------- 학생 ---------- */
let recorder, chunks = [], blob, CODE = "";
async function openStudent() {
  const code = $("h-code").value.trim().toUpperCase();
  if (!code) { say("h-s-status", "코드를 입력하세요. / 请输入代码。", true); return; }
  say("h-s-status", "불러오는 중... / 加载中...");
  try {
    const res = await fetch("/api/assignment/" + encodeURIComponent(code));
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "오류");
    CODE = code;
    $("s-title").textContent = d.title;
    $("sentence").textContent = d.sentence;
    $("result").hidden = true;
    say("h-s-status", ""); say("s-status", "");
    show("student");
  } catch (e) { say("h-s-status", e.message, true); }
}
$("h-start").onclick = openStudent;
$("h-code").onkeydown = e => { if (e.key === "Enter") openStudent(); };
const q = new URLSearchParams(location.search).get("c");
if (q) { $("h-code").value = q; openStudent(); }

$("rec").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      blob = new Blob(chunks, { type: recorder.mimeType });
      $("player").src = URL.createObjectURL(blob);
      $("player").hidden = false;
      stream.getTracks().forEach(t => t.stop());
      $("send").disabled = false;
    };
    recorder.start();
    $("rec").disabled = true; $("stop").disabled = false; $("send").disabled = true;
    say("s-status", "녹음 중... / 录音中...");
  } catch (e) {
    say("s-status", "마이크를 사용할 수 없습니다. 위챗이 아닌 기본 브라우저에서 열어 주세요. / 无法使用麦克风，请用系统浏览器打开。", true);
  }
};
$("stop").onclick = () => { recorder.stop(); $("rec").disabled = false; $("stop").disabled = true; say("s-status", ""); };

$("send").onclick = async () => {
  const student = $("s-name").value.trim();
  if (!student) { say("s-status", "이름을 입력하세요. / 请输入姓名。", true); return; }
  const fd = new FormData();
  fd.append("code", CODE); fd.append("student", student); fd.append("audio", blob, "rec");
  $("send").disabled = true;
  say("s-status", "채점 중... / 评分中...");
  try {
    const res = await fetch("/api/submit", { method: "POST", body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "오류");
    $("score").textContent = d.score + "%";
    $("marks").innerHTML = d.marks.map(m => m.ok ? esc(m.ch) : `<span class="bad">${esc(m.ch)}</span>`).join("");
    $("transcript").textContent = d.transcript;
    $("result").hidden = false;
    say("s-status", "제출 완료! / 提交成功！");
  } catch (e) { say("s-status", e.message, true); }
  $("send").disabled = false;
};

/* ---------- 선생님 ---------- */
let PW = "";
async function api(url, opt = {}) {
  const res = await fetch(url, { ...opt, headers: { "Content-Type": "application/json", "X-Teacher-Password": PW } });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || "오류");
  return d;
}
async function loadList() {
  const rows = await api("/api/assignments");
  $("list").innerHTML = rows.map(a => `
    <div class="item">
      <b>${esc(a.title)}</b> <span class="code">${esc(a.code)}</span><br>
      ${esc(a.sentence)}<br>
      <span class="sub">학생 링크: ${esc(location.origin)}/?c=${esc(a.code)}</span><br>
      <button class="ghost" data-id="${a.id}" data-title="${esc(a.title)}" style="margin-top:.5rem">결과 보기</button>
    </div>`).join("") || "<p class='sub'>아직 숙제가 없습니다. 위에서 첫 숙제를 만들어 보세요.</p>";
}
async function teacherLogin() {
  PW = $("h-pw").value;
  say("h-t-status", "");
  try { await loadList(); $("rpanel").hidden = true; show("teacher"); }
  catch (e) { say("h-t-status", e.message, true); }
}
$("h-login").onclick = teacherLogin;
$("h-pw").onkeydown = e => { if (e.key === "Enter") teacherLogin(); };
if (location.hash === "#teacher") $("h-pw").focus();

$("create").onclick = async () => {
  try {
    await api("/api/assignments", { method: "POST", body: JSON.stringify({ title: $("t-title").value, sentence: $("t-sentence").value }) });
    $("t-title").value = ""; $("t-sentence").value = "";
    await loadList(); say("t-status", "숙제를 만들었습니다.");
  } catch (e) { say("t-status", e.message, true); }
};
$("list").onclick = async e => {
  const id = e.target.dataset.id;
  if (!id) return;
  try {
    const rows = await api("/api/submissions?assignment_id=" + id);
    $("rh").textContent = e.target.dataset.title + " — 제출 " + rows.length + "건";
    $("results").innerHTML = "<tr><th>이름</th><th>점수</th><th>시간</th><th>인식 결과</th><th>녹음</th></tr>" +
      rows.map(r => `<tr><td>${esc(r.student)}</td><td>${esc(r.score)}%</td>
        <td>${esc(new Date(r.created_at).toLocaleString("ko-KR"))}</td><td>${esc(r.transcript)}</td>
        <td>${r.audio_path ? `<button class="ghost" data-play="${r.id}">▶</button>` : "-"}</td></tr>`).join("");
    $("rpanel").hidden = false;
    $("rpanel").scrollIntoView({ behavior: "smooth" });
  } catch (err) { say("t-status", err.message, true); }
};
$("results").onclick = async e => {
  const id = e.target.dataset.play;
  if (!id) return;
  try {
    const res = await fetch("/api/audio/" + id, { headers: { "X-Teacher-Password": PW } });
    if (!res.ok) throw new Error("녹음을 불러오지 못했습니다.");
    new Audio(URL.createObjectURL(await res.blob())).play();
  } catch (err) { say("t-status", err.message, true); }
};
</script>
</body>
</html>
