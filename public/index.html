<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 읽기 숙제 / 韩语朗读作业</title>
<style>
  body { font-family: "Noto Sans KR", system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
  input { font: inherit; padding: .5rem; margin: .2rem 0 .8rem; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: .6rem 1rem; margin: .5rem .5rem .5rem 0; cursor: pointer; }
  #score { font-size: 3rem; font-weight: 700; margin: 1rem 0 .2rem; }
  .bad { color: #c0392b; text-decoration: underline; }
  #sentence, #marks { font-size: 1.5rem; }
  audio { width: 100%; margin-top: .5rem; }
  .muted { color: #666; }
</style>
</head>
<body>
<h1>한국어 읽기 숙제 <span class="muted">韩语朗读作业</span></h1>

<label for="code">숙제 코드 / 作业代码</label>
<input id="code" maxlength="6" autocapitalize="characters">
<button id="load">불러오기 / 加载</button>
<p id="status" class="muted"></p>

<div id="task" hidden>
  <h2 id="title"></h2>
  <p id="sentence"></p>
  <label for="student">이름 / 姓名</label>
  <input id="student" maxlength="50">
  <button id="rec">● 녹음 시작 / 开始录音</button>
  <button id="stop" disabled>■ 정지 / 停止</button>
  <button id="send" disabled>제출 / 提交</button>
  <audio id="player" controls hidden></audio>
</div>

<div id="result" hidden>
  <div id="score"></div>
  <div id="marks"></div>
  <p class="muted">인식 결과 / 识别结果: <span id="transcript"></span></p>
</div>

<script>
const $ = id => document.getElementById(id);
let recorder, chunks = [], blob, sentence = "";
const say = t => $("status").textContent = t;

async function loadTask() {
  const code = $("code").value.trim().toUpperCase();
  if (!code) return;
  say("불러오는 중... / 加载中...");
  try {
    const res = await fetch("/api/assignment/" + encodeURIComponent(code));
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "오류");
    sentence = d.sentence;
    $("title").textContent = d.title;
    $("sentence").textContent = d.sentence;
    $("task").hidden = false;
    $("result").hidden = true;
    say("");
  } catch (e) { say(e.message); }
}
$("load").onclick = loadTask;
const q = new URLSearchParams(location.search).get("c");
if (q) { $("code").value = q; loadTask(); }

$("rec").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      blob = new Blob(chunks, { type: recorder.mimeType });
      $("player").src = URL.createObjectURL(blob);
      $("player").hidden = false;
      stream.getTracks().forEach(t => t.stop());
      $("send").disabled = false;
    };
    recorder.start();
    $("rec").disabled = true; $("stop").disabled = false; $("send").disabled = true;
    say("녹음 중... / 录音中...");
  } catch (e) {
    say("마이크를 사용할 수 없습니다. 위챗이 아닌 기본 브라우저에서 열어 주세요. / 无法使用麦克风，请用系统浏览器打开。");
  }
};
$("stop").onclick = () => { recorder.stop(); $("rec").disabled = false; $("stop").disabled = true; say(""); };

$("send").onclick = async () => {
  const student = $("student").value.trim();
  if (!student) { say("이름을 입력하세요. / 请输入姓名。"); return; }
  const fd = new FormData();
  fd.append("code", $("code").value.trim());
  fd.append("student", student);
  fd.append("audio", blob, "rec");
  $("send").disabled = true;
  say("채점 중... / 评分中...");
  try {
    const res = await fetch("/api/submit", { method: "POST", body: fd });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "오류");
    $("score").textContent = d.score + "%";
    $("marks").innerHTML = d.marks.map(m => m.ok ? m.ch : `<span class="bad">${m.ch}</span>`).join("");
    $("transcript").textContent = d.transcript;
    $("result").hidden = false;
    say("제출 완료! / 提交成功！");
  } catch (e) { say(e.message); }
  $("send").disabled = false;
};
</script>
</body>
</html>
